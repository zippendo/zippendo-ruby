name: Release

# Zippendo's release pipeline generates this SDK and pushes a version tag; this workflow publishes it
# with RubyGems trusted publishing, so no API key is stored here, and attests the gem it pushed. The
# trusted publisher on rubygems.org names this file, so renaming it stops releases until that setting
# is updated.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # the GitHub release
      id-token: write # RubyGems trusted publishing and the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"

      - name: Check the tag matches the gem version
        run: test "v$(ruby -e 'puts Gem::Specification.load(Dir["*.gemspec"].first).version')" = "$GITHUB_REF_NAME"

      - name: Build
        run: gem build ./*.gemspec

      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      # Skipping a version RubyGems already has makes a failed run safe to re-run.
      - name: Publish to RubyGems
        run: |
          if curl -fsS -o /dev/null "https://rubygems.org/api/v2/rubygems/zippendo/versions/${GITHUB_REF_NAME#v}.json"; then
            echo "zippendo ${GITHUB_REF_NAME#v} is already on RubyGems."
          else
            gem push ./*.gem
          fi

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "*.gem"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes \
            "Install with \`gem install zippendo -v ${GITHUB_REF_NAME#v}\`. Guide: https://www.zippendo.com/docs/sdks/overview" \
            ./*.gem
